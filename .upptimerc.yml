  introMessage: 每 5 分鐘從 GitHub Actions 量測一次。掛掉會自動開 Issue，恢復會自動關閉。
  navbar:
    - title: 狀態
      href: /
    - title: 回到遊戲
      href: https://sleep-on-the-couch.lol/
