owner: hryjosn
repo: sleep-on-the-couch-status

# Assign the auto-opened downtime issue so it actually reaches a person.
assignees:
  - hryjosn

sites:
  - name: 今晚睡沙發？首頁
    url: https://sleep-on-the-couch.lol/
  - name: ads.txt
    url: https://sleep-on-the-couch.lol/ads.txt
